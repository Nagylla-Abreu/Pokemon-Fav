<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Pok%C3%A9_Ball_icon.svg/960px-Pok%C3%A9_Ball_icon.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>POKEMON FAVORITOS</title>
</head>
<body>
    <header>
        <h1>Meus Pokémon Favoritos</h1>
        <p>Projeto básico para aprender os fundamentos de HTML e CSS mais a fundo. A seguir, você vai descobrir quais são meus três pokémon favoritos.</p>
    </header>
    <div id="divpai">
        <div id="esq01" class="esqueleto">
            <div class="pokebox">
                <div id="npoke1" class="nomepoke">
                    <div class="nome">
                        <h2>#0007 Squirtle</h2>
                    </div>
                </div>
                <div id="pb1" class="pokebox2">
                    <div class="imgpoke">
                            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/007.png" alt="" width="150px">
                    </div>
                    <div class="tipagem">
                        <p class="tipo">Tipo: Água</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="esq02" class="esqueleto">
            <div class="pokebox">
                <div id="npoke2" class="nomepoke">
                    <div class="nome">
                        <h2>#0350 Milotic</h2>
                    </div>
                </div>
                <div id="pb2" class="pokebox2">
                    <div class="imgpoke">
                            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/350.png" alt="" width="150px">
                    </div>
                    <div class="tipagem">
                        <p class="tipo">Tipo: Água</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="esq03" class="esqueleto">
            <div class="pokebox">
                <div id="npoke3" class="nomepoke">
                    <div class="nome">
                        <h2>#0700 Sylveon</h2>
                    </div>
                </div>
                <div id="pb3" class="pokebox2">
                    <div class="imgpoke">
                            <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/700.png" alt="" width="150px">
                    </div>
                    <div class="tipagem">
                        <p class="tipo">Tipo: Fada</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
